<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabIt Options</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
        max-width: 400px;
        color: #333;
      }

      h1 {
        font-size: 1.4rem;
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-size: 0.95rem;
        margin-bottom: 8px;
      }

      input[type="number"] {
        width: 80px;
        padding: 6px 8px;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-top: 4px;
      }

      button {
        display: block;
        margin-top: 16px;
        padding: 8px 20px;
        font-size: 0.95rem;
        background-color: #1a73e8;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #1558b0;
      }

      #status {
        display: block;
        margin-top: 10px;
        font-size: 0.85rem;
        color: #28a745;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>TabIt Options</h1>

    <label for="maxTabs">
      Maximum number of open tabs:
      <input
        type="number"
        id="maxTabs"
        name="maxTabs"
        min="1"
        max="500"
        value="10"
      />
    </label>

    <button id="save">Save</button>
    <span id="status"></span>

    <script src="options.js"></script>
  </body>
</html>
